<svg xmlns="http://www.w3.org/2000/svg" viewBox="51 183.2 508 190.4" width="508" height="190">
  <title>gigot</title>
  <style>
    .lettres { fill: #FFD60A; }
    .o       { fill: #2EC4F1; }
    .contour { fill: #FF3EA5; }
    .encre   { color: #111111; } /* ombre et arcs */
    /* couleurs en cycle, fondu continu ; mouvement réduit : couleurs fixes ci-dessus */
    @keyframes gigot-couleurs {
      0% { fill: #FF3EA5; }
      16.67% { fill: #FF6A13; }
      33.33% { fill: #FFD60A; }
      50% { fill: #39D353; }
      66.67% { fill: #2EC4F1; }
      83.33% { fill: #7B2FF7; }
      100% { fill: #FF3EA5; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .lettres { animation: gigot-couleurs 24s linear -8s infinite; }
      .o { animation: gigot-couleurs 24s linear -16s infinite; }
      .contour { animation: gigot-couleurs 24s linear 0s infinite; }
    }
  </style>
