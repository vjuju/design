<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reskif</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Le virtuel au service du réel. Reskif est un réseau de kif rassemblant financeur·ses, éclaireur·ses, expert·es et porteur·ses de projets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,500&display=swap">
<style>
  /* Trois panneaux plein écran, un seul canvas derrière. On passe de l'un à l'autre par une animation 3D :
     plongée dans la sphère, puis croissance d'un arbre. Un seul univers, nuit. */
  :root {
    --night: #010101;
    --ink: #ffffff;
    --muted: rgba(255, 255, 255, .62);
    --line: rgba(255, 255, 255, .22);
    --glass: rgba(10, 4, 24, .55);
    --warm: #ffb08a;
    --cold: #9cc0ff;
    --display: "Syne", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --text: "Fraunces", "Iowan Old Style", Georgia, serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--night);
    color: var(--ink);
    font: 14px/1.5 var(--display);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: #ffffff22; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  body[data-panel="0"] #scene, body[data-panel="1"] #scene { cursor: pointer; }

  .panel {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(56px, env(safe-area-inset-right, 0px));
    pointer-events: none;
    text-align: center;
    opacity: 0;
    will-change: opacity, transform;
  }
  .panel.live { pointer-events: auto; }
  #p0 { padding-right: max(20px, env(safe-area-inset-right, 0px)); }

  #p0 h1 {
    margin: 0;
    font: 800 clamp(30px, 8.4vmin, 92px)/.95 var(--display);
    letter-spacing: -.01em;
    text-transform: uppercase;
    text-wrap: balance;
    max-width: 14ch;
    text-shadow: 0 0 10px rgba(0, 0, 0, .7);
  }

  #p1 p {
    margin: 0;
    max-width: 30ch;
    font: 300 italic clamp(24px, 4.4vmin, 44px)/1.22 var(--text);
    text-wrap: balance;
  }
  #p1 strong {
    display: block;
    margin-bottom: .35em;
    font: 800 clamp(48px, 12vmin, 128px)/.9 var(--display);
    font-style: normal;
    letter-spacing: -.02em;
    text-transform: uppercase;
  }
  .role { font-weight: 500; white-space: nowrap; }
  .role.w { color: var(--warm); }
  .role.c { color: var(--cold); }

  #p2 { align-items: stretch; }
  .choose { display: flex; flex-direction: column; justify-content: space-between; gap: 24px; width: min(880px, 100%); }
  .choose h2 {
    margin: 0;
    font: 800 clamp(28px, 6vmin, 64px)/1 var(--display);
    text-transform: uppercase;
    letter-spacing: -.01em;
    text-shadow: 0 0 14px rgba(0, 0, 0, .8);
  }
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .choice {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    min-width: 0;
    padding: 18px 20px;
    text-align: left;
    color: var(--ink);
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 18px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
    transition: border-color .25s, background .25s, transform .25s;
  }
  .choice b { font: 700 clamp(17px, 2.4vmin, 22px)/1.15 var(--display); }
  .choice span { font: 300 italic 15px/1.35 var(--text); color: var(--muted); }
  .choice:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, .5); }
  .choice.w:hover, .choice.w[aria-pressed="true"] { border-color: var(--warm); background: rgba(255, 106, 43, .14); }
  .choice.c:hover, .choice.c[aria-pressed="true"] { border-color: var(--cold); background: rgba(0, 99, 255, .16); }
  .choice:focus-visible, .nav button:focus-visible, .next:focus-visible { outline: 2px solid var(--warm); outline-offset: 3px; }
  .status { margin: 0; min-height: 1.5em; font: 300 italic 16px/1.4 var(--text); color: var(--muted); }

  .nav {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 6px;
  }
  .nav button {
    width: 28px; height: 28px; padding: 0;
    display: grid; place-items: center;
    background: none; border: 0; cursor: pointer;
  }
  .nav button::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    border: 1px solid var(--muted);
    transition: background .3s, border-color .3s, transform .3s;
  }
  .nav button[aria-current="step"]::before { background: var(--ink); border-color: var(--ink); transform: scale(1.25); }

  .next {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px 12px;
    font: 500 11px/1 var(--display);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    background: none; border: 0; cursor: pointer;
    transition: opacity .5s, color .2s;
  }
  .next:hover { color: var(--ink); }
  .next svg { animation: nudge 2.2s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
  body[data-panel="2"] .next, body.moving .next { opacity: 0; pointer-events: none; }

  .credits {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }
  .credits a { color: inherit; text-underline-offset: 2px; }
  .credits a:hover { color: var(--ink); }

  @media (max-width: 640px) {
    .choices { grid-template-columns: 1fr; gap: 8px; }
    .choice { padding: 12px 16px; border-radius: 14px; }
    .choice span { font-size: 13px; }
    .credits { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .next svg { animation: none; } }
  .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body data-panel="0">
<canvas id="scene" tabindex="0" aria-label="Animation 3D. Sur le premier panneau, survoler le centre de la sphère l'accélère, s'en éloigner la ralentit."></canvas>

<section class="panel" id="p0" aria-label="Accueil">
  <h1>Le virtuel au service du réel</h1>
</section>

<section class="panel" id="p1" aria-label="Le réseau" aria-hidden="true">
  <p><strong>Reskif</strong>est un réseau de kif rassemblant
    <span class="role w">financeur·ses</span>, <span class="role c">éclaireur·ses</span>,
    <span class="role w">expert·es</span> et <span class="role c">porteur·ses de projets</span>.</p>
</section>

<section class="panel" id="p2" aria-label="Rejoindre" aria-hidden="true">
  <div class="choose">
    <h2>Et vous, qui <span style="white-space:nowrap">êtes-vous&nbsp;?</span></h2>
    <div>
      <div class="choices">
        <button type="button" class="choice w" id="c-financeur" data-label="financeur·se" aria-pressed="false" tabindex="-1"><b>Je suis financeur·se</b><span>Je fais pousser des projets qui ont du sens.</span></button>
        <button type="button" class="choice c" id="c-eclaireur" data-label="éclaireur·se" aria-pressed="false" tabindex="-1"><b>Je suis éclaireur·se</b><span>J'ouvre la voie et je partage l'élan.</span></button>
        <button type="button" class="choice w" id="c-expert" data-label="expert·e" aria-pressed="false" tabindex="-1"><b>Je suis expert·e</b><span>J'apporte mon savoir-faire là où il compte.</span></button>
        <button type="button" class="choice c" id="c-porteur" data-label="porteur·se de projet" aria-pressed="false" tabindex="-1"><b>Je porte un projet</b><span>Je cherche des allié·es pour le faire grandir.</span></button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
  </div>
</section>

<nav class="nav" aria-label="Panneaux">
  <button type="button" data-go="0" aria-label="Le virtuel au service du réel" aria-current="step"></button>
  <button type="button" data-go="1" aria-label="Le réseau"></button>
  <button type="button" data-go="2" aria-label="Qui êtes-vous ?"></button>
</nav>

<button type="button" class="next" id="next">
  <span id="next-label">Survolez le cœur · Défilez pour entrer</span>
  <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
</button>

<div class="credits">Sphère : <a href="https://github.com/brunosimon/organic-sphere" target="_blank" rel="noopener">Organic Sphere</a>

<script>
(function () {
  if (!window.THREE || !THREE.EffectComposer || !THREE.UnrealBloomPass) {
    document.body.insertAdjacentHTML('beforeend', '<div class="fallback">Three.js n’a pas pu se charger. Vérifiez la connexion puis rechargez la page.</div>');
    return;
  }

  /* =====================================================================
     Shaders : repris tels quels de brunosimon/organic-sphere
     (src/Experience/shaders/sphere/vertex.glsl et fragment.glsl,
     bruit perlin4d de Stefan Gustavson).
     ===================================================================== */
  const perlin4d = `
//	Classic Perlin 3D Noise 
//	by Stefan Gustavson
//
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
vec4 fade(vec4 t) {return t*t*t*(t*(t*6.0-15.0)+10.0);}

float perlin4d(vec4 P){
  vec4 Pi0 = floor(P); // Integer part for indexing
  vec4 Pi1 = Pi0 + 1.0; // Integer part + 1
  Pi0 = mod(Pi0, 289.0);
  Pi1 = mod(Pi1, 289.0);
  vec4 Pf0 = fract(P); // Fractional part for interpolation
  vec4 Pf1 = Pf0 - 1.0; // Fractional part - 1.0
  vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
  vec4 iy = vec4(Pi0.yy, Pi1.yy);
  vec4 iz0 = vec4(Pi0.zzzz);
  vec4 iz1 = vec4(Pi1.zzzz);
  vec4 iw0 = vec4(Pi0.wwww);
  vec4 iw1 = vec4(Pi1.wwww);

  vec4 ixy = permute(permute(ix) + iy);
  vec4 ixy0 = permute(ixy + iz0);
  vec4 ixy1 = permute(ixy + iz1);
  vec4 ixy00 = permute(ixy0 + iw0);
  vec4 ixy01 = permute(ixy0 + iw1);
  vec4 ixy10 = permute(ixy1 + iw0);
  vec4 ixy11 = permute(ixy1 + iw1);

  vec4 gx00 = ixy00 / 7.0;
  vec4 gy00 = floor(gx00) / 7.0;
  vec4 gz00 = floor(gy00) / 6.0;
  gx00 = fract(gx00) - 0.5;
  gy00 = fract(gy00) - 0.5;
  gz00 = fract(gz00) - 0.5;
  vec4 gw00 = vec4(0.75) - abs(gx00) - abs(gy00) - abs(gz00);
  vec4 sw00 = step(gw00, vec4(0.0));
  gx00 -= sw00 * (step(0.0, gx00) - 0.5);
  gy00 -= sw00 * (step(0.0, gy00) - 0.5);

  vec4 gx01 = ixy01 / 7.0;
  vec4 gy01 = floor(gx01) / 7.0;
  vec4 gz01 = floor(gy01) / 6.0;
  gx01 = fract(gx01) - 0.5;
  gy01 = fract(gy01) - 0.5;
  gz01 = fract(gz01) - 0.5;
  vec4 gw01 = vec4(0.75) - abs(gx01) - abs(gy01) - abs(gz01);
  vec4 sw01 = step(gw01, vec4(0.0));
  gx01 -= sw01 * (step(0.0, gx01) - 0.5);
  gy01 -= sw01 * (step(0.0, gy01) - 0.5);

  vec4 gx10 = ixy10 / 7.0;
  vec4 gy10 = floor(gx10) / 7.0;
  vec4 gz10 = floor(gy10) / 6.0;
  gx10 = fract(gx10) - 0.5;
  gy10 = fract(gy10) - 0.5;
  gz10 = fract(gz10) - 0.5;
  vec4 gw10 = vec4(0.75) - abs(gx10) - abs(gy10) - abs(gz10);
  vec4 sw10 = step(gw10, vec4(0.0));
  gx10 -= sw10 * (step(0.0, gx10) - 0.5);
  gy10 -= sw10 * (step(0.0, gy10) - 0.5);

  vec4 gx11 = ixy11 / 7.0;
  vec4 gy11 = floor(gx11) / 7.0;
  vec4 gz11 = floor(gy11) / 6.0;
  gx11 = fract(gx11) - 0.5;
  gy11 = fract(gy11) - 0.5;
  gz11 = fract(gz11) - 0.5;
  vec4 gw11 = vec4(0.75) - abs(gx11) - abs(gy11) - abs(gz11);
  vec4 sw11 = step(gw11, vec4(0.0));
  gx11 -= sw11 * (step(0.0, gx11) - 0.5);
  gy11 -= sw11 * (step(0.0, gy11) - 0.5);

  vec4 g0000 = vec4(gx00.x,gy00.x,gz00.x,gw00.x);
  vec4 g1000 = vec4(gx00.y,gy00.y,gz00.y,gw00.y);
  vec4 g0100 = vec4(gx00.z,gy00.z,gz00.z,gw00.z);
  vec4 g1100 = vec4(gx00.w,gy00.w,gz00.w,gw00.w);
  vec4 g0010 = vec4(gx10.x,gy10.x,gz10.x,gw10.x);
  vec4 g1010 = vec4(gx10.y,gy10.y,gz10.y,gw10.y);
  vec4 g0110 = vec4(gx10.z,gy10.z,gz10.z,gw10.z);
  vec4 g1110 = vec4(gx10.w,gy10.w,gz10.w,gw10.w);
  vec4 g0001 = vec4(gx01.x,gy01.x,gz01.x,gw01.x);
  vec4 g1001 = vec4(gx01.y,gy01.y,gz01.y,gw01.y);
  vec4 g0101 = vec4(gx01.z,gy01.z,gz01.z,gw01.z);
  vec4 g1101 = vec4(gx01.w,gy01.w,gz01.w,gw01.w);
  vec4 g0011 = vec4(gx11.x,gy11.x,gz11.x,gw11.x);
  vec4 g1011 = vec4(gx11.y,gy11.y,gz11.y,gw11.y);
  vec4 g0111 = vec4(gx11.z,gy11.z,gz11.z,gw11.z);
  vec4 g1111 = vec4(gx11.w,gy11.w,gz11.w,gw11.w);

  vec4 norm00 = taylorInvSqrt(vec4(dot(g0000, g0000), dot(g0100, g0100), dot(g1000, g1000), dot(g1100, g1100)));
  g0000 *= norm00.x;
  g0100 *= norm00.y;
  g1000 *= norm00.z;
  g1100 *= norm00.w;

  vec4 norm01 = taylorInvSqrt(vec4(dot(g0001, g0001), dot(g0101, g0101), dot(g1001, g1001), dot(g1101, g1101)));
  g0001 *= norm01.x;
  g0101 *= norm01.y;
  g1001 *= norm01.z;
  g1101 *= norm01.w;

  vec4 norm10 = taylorInvSqrt(vec4(dot(g0010, g0010), dot(g0110, g0110), dot(g1010, g1010), dot(g1110, g1110)));
  g0010 *= norm10.x;
  g0110 *= norm10.y;
  g1010 *= norm10.z;
  g1110 *= norm10.w;

  vec4 norm11 = taylorInvSqrt(vec4(dot(g0011, g0011), dot(g0111, g0111), dot(g1011, g1011), dot(g1111, g1111)));
  g0011 *= norm11.x;
  g0111 *= norm11.y;
  g1011 *= norm11.z;
  g1111 *= norm11.w;

  float n0000 = dot(g0000, Pf0);
  float n1000 = dot(g1000, vec4(Pf1.x, Pf0.yzw));
  float n0100 = dot(g0100, vec4(Pf0.x, Pf1.y, Pf0.zw));
  float n1100 = dot(g1100, vec4(Pf1.xy, Pf0.zw));
  float n0010 = dot(g0010, vec4(Pf0.xy, Pf1.z, Pf0.w));
  float n1010 = dot(g1010, vec4(Pf1.x, Pf0.y, Pf1.z, Pf0.w));
  float n0110 = dot(g0110, vec4(Pf0.x, Pf1.yz, Pf0.w));
  float n1110 = dot(g1110, vec4(Pf1.xyz, Pf0.w));
  float n0001 = dot(g0001, vec4(Pf0.xyz, Pf1.w));
  float n1001 = dot(g1001, vec4(Pf1.x, Pf0.yz, Pf1.w));
  float n0101 = dot(g0101, vec4(Pf0.x, Pf1.y, Pf0.z, Pf1.w));
  float n1101 = dot(g1101, vec4(Pf1.xy, Pf0.z, Pf1.w));
  float n0011 = dot(g0011, vec4(Pf0.xy, Pf1.zw));
  float n1011 = dot(g1011, vec4(Pf1.x, Pf0.y, Pf1.zw));
  float n0111 = dot(g0111, vec4(Pf0.x, Pf1.yzw));
  float n1111 = dot(g1111, Pf1);

  vec4 fade_xyzw = fade(Pf0);
  vec4 n_0w = mix(vec4(n0000, n1000, n0100, n1100), vec4(n0001, n1001, n0101, n1101), fade_xyzw.w);
  vec4 n_1w = mix(vec4(n0010, n1010, n0110, n1110), vec4(n0011, n1011, n0111, n1111), fade_xyzw.w);
  vec4 n_zw = mix(n_0w, n_1w, fade_xyzw.z);
  vec2 n_yzw = mix(n_zw.xy, n_zw.zw, fade_xyzw.y);
  float n_xyzw = mix(n_yzw.x, n_yzw.y, fade_xyzw.x);
  return 2.2 * n_xyzw;
}
`;

  const vertexShader = `
#define M_PI 3.1415926535897932384626433832795

uniform vec3 uLightAColor;
uniform vec3 uLightAPosition;
uniform float uLightAIntensity;
uniform vec3 uLightBColor;
uniform vec3 uLightBPosition;
uniform float uLightBIntensity;

uniform vec2 uSubdivision;

uniform vec3 uOffset;

uniform float uDistortionFrequency;
uniform float uDistortionStrength;
uniform float uDisplacementFrequency;
uniform float uDisplacementStrength;

uniform float uFresnelOffset;
uniform float uFresnelMultiplier;
uniform float uFresnelPower;

uniform float uTime;

varying vec3 vColor;

${perlin4d}

vec3 getDisplacedPosition(vec3 _position)
{
    vec3 distoredPosition = _position;
    distoredPosition += perlin4d(vec4(distoredPosition * uDistortionFrequency + uOffset, uTime)) * uDistortionStrength;

    float perlinStrength = perlin4d(vec4(distoredPosition * uDisplacementFrequency + uOffset, uTime));

    vec3 displacedPosition = _position;
    displacedPosition += normalize(_position) * perlinStrength * uDisplacementStrength;

    return displacedPosition;
}

void main()
{
    // Position
    vec3 displacedPosition = getDisplacedPosition(position);
    vec4 viewPosition = viewMatrix * vec4(displacedPosition, 1.0);
    gl_Position = projectionMatrix * viewPosition;

    // Bi tangents
    float distanceA = (M_PI * 2.0) / uSubdivision.x;
    float distanceB = M_PI / uSubdivision.x;

    vec3 biTangent = cross(normal, tangent.xyz);

    vec3 positionA = position + tangent.xyz * distanceA;
    vec3 displacedPositionA = getDisplacedPosition(positionA);

    vec3 positionB = position + biTangent.xyz * distanceB;
    vec3 displacedPositionB = getDisplacedPosition(positionB);

    vec3 computedNormal = cross(displacedPositionA - displacedPosition.xyz, displacedPositionB - displacedPosition.xyz);
    computedNormal = normalize(computedNormal);

    // Fresnel
    vec3 viewDirection = normalize(displacedPosition.xyz - cameraPosition);
    float fresnel = uFresnelOffset + (1.0 + dot(viewDirection, computedNormal)) * uFresnelMultiplier;
    fresnel = pow(max(0.0, fresnel), uFresnelPower);

    // Color
    float lightAIntensity = max(0.0, - dot(computedNormal.xyz, normalize(- uLightAPosition))) * uLightAIntensity;
    float lightBIntensity = max(0.0, - dot(computedNormal.xyz, normalize(- uLightBPosition))) * uLightBIntensity;

    vec3 color = vec3(0.0);
    color = mix(color, uLightAColor, lightAIntensity * fresnel);
    color = mix(color, uLightBColor, lightBIntensity * fresnel);
    color = mix(color, vec3(1.0), clamp(pow(max(0.0, fresnel - 0.8), 3.0), 0.0, 1.0));

    // Varying
    vColor = color;
}`;

  const fragmentShader = `
varying vec3 vColor;

void main()
{
    gl_FragColor = vec4(vColor, 1.0);
}`;

  const bloomCompositeShader = `
varying vec2 vUv;
uniform sampler2D blurTexture1;
uniform sampler2D blurTexture2;
uniform sampler2D blurTexture3;
uniform sampler2D blurTexture4;
uniform sampler2D blurTexture5;
uniform sampler2D dirtTexture;
uniform float bloomStrength;
uniform float bloomRadius;
uniform float bloomFactors[NUM_MIPS];
uniform vec3 bloomTintColors[NUM_MIPS];
uniform vec3 uTintColor;
uniform float uTintStrength;

float lerpBloomFactor(const in float factor) {
    float mirrorFactor = 1.2 - factor;
    return mix(factor, mirrorFactor, bloomRadius);

    uMaxY: { value: treeData.maxY },

      const lookY = dist * treeTan + treeData.maxY * 0.02;
      const orbit = time * 0.00004 + growT * 0.9;
      treeTarget.set(tree.position.x, lookY, 0);
      camera.position.set(tree.position.x + Math.sin(orbit) * dist, lookY, Math.cos(orbit) * dist);
      camera.lookAt(treeTarget);
    }
    camera.updateProjectionMatrix();
    treeUniforms.uGrow.value = grow * 1.06;

    // Textes
    panels[0].style.opacity = String(1 - smoothstep(0, 0.35, dive));
    panels[0].style.transform = `scale(${1 + dive * 0.6})`;
    panels[1].style.opacity = String(P <= 1 ? smoothstep(0.82, 1, dive) : 1 - smoothstep(0, 0.12, growT));
    panels[1].style.transform = `translateY(${-smoothstep(0, 0.12, growT) * 30}px)`;
    panels[2].style.opacity = String(smoothstep(0.7, 1, growT));
    panels[2].style.transform = `translateY(${(1 - smoothstep(0.7, 1, growT)) * 24}px)`;

    document.body.classList.toggle('moving', P !== target);
    setPanel(P === target ? target : (P < 0.5 ? 0 : P < 1.5 ? 1 : 2));
  }

  /* =====================================================================
     Boucle (delta en millisecondes, comme Time.js)
     ===================================================================== */
  let last = Date.now();
  function tick() {
    const now = Date.now();
    const delta = Math.min(now - last, 60);
    last = now;

    if (P !== target) {
      const dir = Math.sign(target - P);
      const seg = dir > 0 ? Math.floor(P) : Math.ceil(P) - 1;
      const dur = DURATIONS[Math.min(Math.max(seg, 0), 1)] * (dir < 0 ? 0.65 : 1);
      P += dir * delta / dur;
      if ((dir > 0 && P >= target) || (dir < 0 && P <= target)) { P = target; arrivedAt = performance.now(); }
    }

    const h = hoverSpeed();
    const diving = P > 0 && P < 1 && target > P;
    speed = h.speed + (diving ? 4 : 0);
    agitation = Math.max(h.agitation, diving ? 0.8 : 0);
    if (P < 1) updateSphere(delta);
    treeUniforms.uTime.value += delta / 1000;

    stage(now);
    composer.render();
    requestAnimationFrame(tick);
  }
  setPanel(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
